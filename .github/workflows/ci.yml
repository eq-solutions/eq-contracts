name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, test, and fail if built .js drifted from .ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Built output must match committed (same rule as eq-design-tokens)
        run: |
          if [[ -n "$(git status --porcelain -- '*.js')" ]]; then
            echo "::error::index.js / brand-kit.js do not match their .ts source. Run 'npm run build' and commit."
            git diff -- '*.js'
            exit 1
          fi
      - run: npm test
